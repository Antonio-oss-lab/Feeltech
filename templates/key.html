<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Acceso administrador</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/result_style.css') }}">

</head>

<body>
    <div class="contenedor-principal">
        <h1 class="titulo-feeltech">FEELTECH</h1>

        <div class="contenedor">

            <h2>
                ACCESO ADMINISTRADOR
            </h2>

            <form action="{{ url_for('datos') }}" method="POST">

                <input
                    type="password"
                    name="password"
                    placeholder="Ingresa la contraseña"
                    required
                >

                <button type="submit">

                    Entrar

                </button>

            </form>

            {% if error %}

                <div class="error">

                    {{ error }}

                </div>

            {% endif %}

        </div>
    </div>
</body>


</html>
