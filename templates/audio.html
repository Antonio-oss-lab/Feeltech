<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Audio - FeelTech</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #7da5af, #5b9987);
            color: #174a5b;
        }

        .contenedor {
            width: 90%;
            max-width: 650px;
            padding: 40px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 35px;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
        }

        #estado {
            min-height: 55px;
            margin: 25px 0;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 15px 30px;
            font-size: 17px;
            cursor: pointer;
            background: #174a5b;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: #236b75;
        }

        button:disabled {
            background: #82999b;
            cursor: not-allowed;
        }

        #progreso {
            margin-top: 20px;
            font-size: 16px;
        }

        .barra {
            width: 100%;
            height: 12px;
            margin-top: 12px;
            background: #dce8e5;
            border-radius: 10px;
            overflow: hidden;
        }

        #avance {
            width: 0%;
            height: 100%;
            background: #4b927d;
            transition: width 0.3s;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <h1>FEELTECH</h1>

        <p>
            Bienvenido al modo de audio.
            Responde las preguntas hablando con claridad.
        </p>

        <p id="estado">Presiona comenzar para iniciar.</p>

        <button id="comenzar" onclick="comenzarAudio()">
            Comenzar
        </button>

        <div id="progreso">
            <span id="numeroPregunta">Pregunta 0 de 5</span>
            <div class="barra">
                <div id="avance"></div>
            </div>
        </div>
    </div>

    <script>
        const preguntas = [
            "¿Cómo te sentiste hoy?",
            "¿Cómo te has sentido durante estos días?",
            "¿Hay algo que te haya hecho sentir bien?",
            "¿Hay algo que te haya preocupado o puesto nervioso?",
            "¿Qué crees que podría ayudarte a sentirte mejor?"
        ];

        let preguntaActual = 0;
        let reconocimiento;
        let grabadora;
        let partesAudio = [];
        let microfono;
        let audioPestana;
        let contextoAudio;
        let destinoAudio;
        let grabando = false;

        const estado = document.getElementById("estado");
        const boton = document.getElementById("comenzar");
        const progreso = document.getElementById("progreso");
        const numeroPregunta = document.getElementById("numeroPregunta");
        const avance = document.getElementById("avance");

        function hablar(texto) {
            return new Promise((resolve) => {
                speechSynthesis.cancel();

                const mensaje = new SpeechSynthesisUtterance(texto);
                mensaje.lang = "es-MX";
                mensaje.rate = 0.9;
                mensaje.onend = resolve;
                mensaje.onerror = resolve;

                speechSynthesis.speak(mensaje);
            });
        }

        function escuchar() {
            return new Promise((resolve) => {
                reconocimiento = new (
                    window.SpeechRecognition ||
                    window.webkitSpeechRecognition
                )();

                reconocimiento.lang = "es-MX";
                reconocimiento.continuous = false;
                reconocimiento.interimResults = false;

                let terminado = false;

                const finalizar = (respuesta) => {
                    if (terminado) return;

                    terminado = true;
                    clearTimeout(limite);
                    resolve(respuesta);
                };

                reconocimiento.onresult = (evento) => {
                    const respuesta = evento.results[0][0].transcript;
                    finalizar(respuesta);
                };

                reconocimiento.onerror = () => {
                    finalizar("");
                };

                reconocimiento.onend = () => {
                    finalizar("");
                };

                const limite = setTimeout(() => {
                    reconocimiento.stop();
                    finalizar("");
                }, 20000);

                reconocimiento.start();
            });
        }

        async function pedirDato(pregunta) {
            while (true) {
                estado.textContent = pregunta;
                await hablar(pregunta);

                const respuesta = await escuchar();

                if (respuesta.trim() !== "") {
                    return respuesta.trim();
                }

                await hablar("No pude escuchar tu respuesta. Vamos a intentarlo otra vez.");
            }
        }

        async function guardarDatos() {
            const grado = await pedirDato("¿En qué grado estás?");
            const grupo = await pedirDato("¿A qué grupo perteneces?");
            const nombre = await pedirDato("¿Cuál es tu nombre?");

            const respuesta = await fetch("/guardar_datos_audio", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    grado: grado,
                    grupo: grupo,
                    nombre: nombre
                })
            });

            if (!respuesta.ok) {
                throw new Error("No se pudieron guardar los datos.");
            }
        }

        async function comenzarAudio() {
            boton.disabled = true;
            boton.style.display = "none";

            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                    throw new Error("Tu navegador no permite compartir el audio de la pestaña.");
                }

                if (!navigator.mediaDevices.getUserMedia) {
                    throw new Error("No se puede acceder al micrófono.");
                }

                if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
                    throw new Error("Tu navegador no admite reconocimiento de voz. Usa Google Chrome.");
                }

                estado.textContent = "Selecciona esta pestaña y activa Compartir audio de la pestaña.";

                audioPestana = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: true
                });

                const pistasAudio = audioPestana.getAudioTracks();

                if (pistasAudio.length === 0) {
                    throw new Error("No se compartió el audio de la pestaña. Vuelve a intentarlo y activa Compartir audio de la pestaña.");
                }

                microfono = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

                await guardarDatos();

                contextoAudio = new AudioContext();
                await contextoAudio.resume();

                const fuenteMicrofono = contextoAudio.createMediaStreamSource(microfono);
                const fuentePestana = contextoAudio.createMediaStreamSource(
                    new MediaStream(pistasAudio)
                );

                destinoAudio = contextoAudio.createMediaStreamDestination();

                fuenteMicrofono.connect(destinoAudio);
                fuentePestana.connect(destinoAudio);

                partesAudio = [];

                let tipoAudio = "audio/webm;codecs=opus";

                if (!MediaRecorder.isTypeSupported(tipoAudio)) {
                    tipoAudio = "audio/webm";
                }

                grabadora = new MediaRecorder(destinoAudio.stream, {
                    mimeType: tipoAudio
                });

                grabadora.ondataavailable = (evento) => {
                    if (evento.data.size > 0) {
                        partesAudio.push(evento.data);
                    }
                };

                grabadora.start();

                grabando = true;
                preguntaActual = 0;

                await realizarPreguntas();

            } catch (error) {
                await detenerDispositivos();

                estado.textContent = error.message || "Ocurrió un error al iniciar el audio.";
                boton.style.display = "inline-block";
                boton.disabled = false;
            }
        }

        async function realizarPreguntas() {
            while (preguntaActual < preguntas.length) {
                numeroPregunta.textContent = `Pregunta ${preguntaActual + 1} de 5`;
                avance.style.width = `${((preguntaActual + 1) / 5) * 100}%`;

                estado.textContent = "Escucha la pregunta.";

                await hablar(preguntas[preguntaActual]);

                let respuesta = "";

                while (respuesta.trim() === "") {
                    estado.textContent = "Te escucho. Responde hablando.";

                    respuesta = await escuchar();

                    if (respuesta.trim() === "") {
                        estado.textContent = "No pude escuchar tu respuesta. Inténtalo otra vez.";
                        await hablar("No pude escuchar tu respuesta. Por favor, repite tu respuesta.");
                        await hablar(preguntas[preguntaActual]);
                    }
                }

                preguntaActual++;
            }

            estado.textContent = "Entrevista terminada. Guardando audio...";

            await hablar("Muchas gracias por responder las preguntas. Tu entrevista ha terminado.");

            await finalizarGrabacion();
        }

        async function finalizarGrabacion() {
            if (!grabando) return;

            grabando = false;

            const audioFinal = await new Promise((resolve) => {
                grabadora.onstop = () => {
                    resolve(new Blob(partesAudio, {
                        type: grabadora.mimeType || "audio/webm"
                    }));
                };

                grabadora.stop();
            });

            const formulario = new FormData();
            formulario.append("audio_completo", audioFinal, "entrevista.webm");

            try {
                const respuesta = await fetch("/guardar_audio_completo", {
                    method: "POST",
                    body: formulario
                });

                if (!respuesta.ok) {
                    throw new Error("No se pudo guardar la entrevista.");
                }

                estado.textContent = "¡Entrevista guardada correctamente!";

                await detenerDispositivos();

                window.location.href = "/finalizar_audio";

            } catch (error) {
                estado.textContent = error.message;
                boton.style.display = "inline-block";
                boton.disabled = false;
                await detenerDispositivos();
            }
        }

        async function detenerDispositivos() {
            grabando = false;

            if (reconocimiento) {
                try {
                    reconocimiento.abort();
                } catch (error) {}
            }

            if (microfono) {
                microfono.getTracks().forEach(pista => pista.stop());
                microfono = null;
            }

            if (audioPestana) {
                audioPestana.getTracks().forEach(pista => pista.stop());
                audioPestana = null;
            }

            if (contextoAudio && contextoAudio.state !== "closed") {
                await contextoAudio.close();
                contextoAudio = null;
            }
        }
    </script>

</body>
</html>
